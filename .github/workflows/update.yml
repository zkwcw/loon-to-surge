name: Loon → Surge 自动转换

on:
  schedule:
    # 每天凌晨 2:00 (UTC+8 = UTC-8+16, 但 cron 用 UTC)
    # 18:00 UTC = 02:00 UTC+8
    - cron: '0 18 * * *'
  
  workflow_dispatch:  # 手动触发
    inputs:
      script_hub_url:
        description: 'Script-Hub API 地址 (可选)'
        required: false
        default: 'http://127.0.0.1:9100'

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          pip install pyyaml requests
      
      - name: 🐳 Start Script-Hub
        run: |
          docker pull xream/script-hub:latest
          docker run -d --name script-hub \
            -p 9100:9100 \
            -e HOST=0.0.0.0 \
            -e PORT=9100 \
            xream/script-hub:latest
          
          # 等待服务启动
          echo "⏳ 等待 Script-Hub 启动..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:9100/ > /dev/null 2>&1; then
              echo "✅ Script-Hub 已就绪"
              break
            fi
            sleep 2
          done
      
      - name: 🔄 转换插件
        env:
          SCRIPT_HUB_URL: 'http://127.0.0.1:9100'
        run: |
          cd ${{ github.workspace }}
          python scripts/convert.py
      
      - name: 📊 检查变更
        id: check
        run: |
          if git diff --quiet modules/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 无变更"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到变更"
          fi
      
      - name: 📝 更新日期
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "# 自动生成于 $(date '+%Y-%m-%d %H:%M:%S UTC+8')" > .last_update
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> .last_update
      
      - name: 🚀 提交并推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/ README.md .last_update
          git commit -m "🔄 自动更新 $(date '+%Y-%m-%d')"
          git push
